# Pulls the Andamio Papers from ecosystem-enterprise and opens a PR with the
# regenerated content. Fired by a repository_dispatch from ecosystem-enterprise
# (when papers change) or manually. Does NOT deploy — a human merges the PR;
# deployment stays the existing manual vercel-deploy.yml posture.
#
# ── ACTIVATION (not yet live) ──────────────────────────────────────────────
#   1. Add secret PAPERS_SYNC_TOKEN (read access to the private
#      ecosystem-enterprise repo) — a fine-grained GitHub App token is preferred
#      over a long-lived PAT.
#   2. Set `ref:` below to the branch the papers live on. They are NOT on main
#      yet (currently a docs/draft branch). Use that branch to test pre-merge;
#      flip to the default branch once the papers merge.
#   3. For full automation, add ecosystem-enterprise/.github/workflows/
#      notify-landing.yml (staged in orch) + its LANDING_DISPATCH_TOKEN secret.
name: Sync Andamio Papers

on:
  repository_dispatch:
    types: [papers-updated]
  workflow_dispatch: {} # manual re-sync

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout landing repo
        uses: actions/checkout@v4

      - name: Checkout ecosystem-enterprise (papers source)
        uses: actions/checkout@v4
        with:
          repository: Andamio-Platform/ecosystem-enterprise
          token: ${{ secrets.PAPERS_SYNC_TOKEN }}
          # TODO(activation): set to the branch the papers live on (not yet on main).
          ref: main
          path: papers-src
          sparse-checkout: papers

      - name: Sync papers -> content
        run: |
          chmod +x scripts/sync-papers.sh
          SRC=papers-src/papers DEST=src/content/papers scripts/sync-papers.sh

      - name: Open PR with regenerated content
        uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/sync-papers
          base: main
          title: "chore: sync Andamio Papers from ecosystem-enterprise"
          commit-message: "chore: sync Andamio Papers (generated)"
          body: |
            Automated sync of `papers/*.md` from `ecosystem-enterprise`.
            Generated by `sync-papers.yml` — review the content diff, then
            merge. Deploy via the manual **Deploy to Vercel** workflow.
          labels: automated, papers
          delete-branch: true
