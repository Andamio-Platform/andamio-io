name: Deploy to Vercel

on:
  # Allow manual deployment trigger only
  workflow_dispatch:
    inputs:
      deployment_type:
        description: 'Deployment type'
        required: true
        default: 'production'
        type: choice
        options:
          - production

env:
  VERCEL_ORG_ID: team_1AX70WxmbE1iKckO2WwVycBR
  VERCEL_PROJECT_ID: prj_DZD7wtNhC5eVFaiyHitnkY5hFoXw

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=1zOFwGJKeA6FiMBODUGvNWNA

      - name: Build Project Artifacts
        run: vercel build --prod --token=1zOFwGJKeA6FiMBODUGvNWNA

      - name: Deploy Project Artifacts to Vercel
        id: deploy
        run: |
          if [ "${{ github.event.inputs.deployment_type }}" == "preview" ]; then
            # Deploy as preview
            vercel deploy --prebuilt --token=1zOFwGJKeA6FiMBODUGvNWNA > deployment-url.txt
            echo "deployment_type=preview" >> $GITHUB_OUTPUT
          else
            # Deploy to production
            vercel deploy --prebuilt --prod --token=1zOFwGJKeA6FiMBODUGvNWNA > deployment-url.txt
            echo "deployment_type=production" >> $GITHUB_OUTPUT
          fi
          echo "deployment_url=$(cat deployment-url.txt)" >> $GITHUB_OUTPUT

      - name: Update deployment status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Manual deployment successful!"
            echo "URL: ${{ steps.deploy.outputs.deployment_url }}"
            echo "Type: ${{ steps.deploy.outputs.deployment_type }}"
          else
            echo "❌ Manual deployment failed!"
            exit 1
          fi
